services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fintrack
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: fintrack
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintrack"]
      interval: 5s
      retries: 10

  auth:
    build: ./services/auth
    ports: ["4001:4001"]
    environment:
      PORT: 4001
      DATABASE_URL: postgres://fintrack:${DB_PASSWORD}@db:5432/fintrack
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db: { condition: service_healthy }

  transactions:
    build: ./services/transactions
    ports: ["4002:4002"]
    environment:
      PORT: 4002
      DATABASE_URL: postgres://fintrack:${DB_PASSWORD}@db:5432/fintrack
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db: { condition: service_healthy }

  reports:
    build: ./services/reports
    ports: ["4003:4003"]
    environment:
      PORT: 4003
      DATABASE_URL: postgres://fintrack:${DB_PASSWORD}@db:5432/fintrack
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db: { condition: service_healthy }

  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [auth, transactions, reports]

volumes:
  pgdata:
