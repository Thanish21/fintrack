apiVersion: apps/v1
kind: Deployment
metadata:
  name: transactions
  namespace: fintrack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transactions
  template:
    metadata:
      labels:
        app: transactions
    spec:
      containers:
        - name: transactions
          image: fintrack-transactions:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4002
