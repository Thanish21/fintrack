services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fintrack
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: fintrack
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintrack"]
      interval: 5s
      retries: 10

  reports-blue:
    image: fintrack-reports:1.0.0
    environment: &env
      PORT: 4003
      DATABASE_URL: postgres://fintrack:${DB_PASSWORD}@db:5432/fintrack
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db: { condition: service_healthy }

  reports-green:
    image: fintrack-reports:2.0.0
    environment: *env
    profiles: ["green"]
    depends_on:
      db: { condition: service_healthy }

  gateway:
    image: nginx:alpine
    ports: ["8080:80"]
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on: [reports-blue]
