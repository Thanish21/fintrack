name: Build and Push
on:
  push:
    branches: [main]

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth, transactions, reports]
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./services/${{ matrix.service }}/package.json').version")" >> $GITHUB_OUTPUT
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fintrack-${{ matrix.service }}:${{ steps.ver.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/fintrack-${{ matrix.service }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/fintrack-${{ matrix.service }}:latest
